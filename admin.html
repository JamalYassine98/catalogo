<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}

.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:520px){.row{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}.tg{position:relative;width:78px;height:42px;border-radius:999px;background:var(--bad);border:0;cursor:pointer;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--ok)}.tg.on::after{left:40px}
.st{font:800 18px Inter,sans-serif}.st.on{color:var(--ok)}.st.off{color:var(--bad)}
.pl{display:grid;gap:10px}.pi{display:flex;gap:12px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:10px;cursor:pointer}.pi img{width:84px;height:56px;object-fit:contain;background:#fff;border-radius:10px;flex:none}.pi b{display:block;font-size:15px}.pi small{color:var(--mu)}.pi .r{margin-left:auto;text-align:right;font-weight:800;color:var(--ok);white-space:nowrap}.pi.h{opacity:.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.tags .x{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.rem{display:flex;flex-direction:row;align-items:center;gap:12px;font-size:14px;color:var(--tx);font-weight:500;cursor:pointer}.rem input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--ac);flex:none}.rem small{display:block;color:var(--mu);font-size:12px;font-weight:400;margin-top:2px;line-height:1.4}
.chk{display:flex;gap:8px;flex-wrap:wrap}.chk label{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--tx);font-weight:500;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:8px 12px}.chk input{width:auto;min-height:0}
.msg{font-size:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent)}.msg.e{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.ph{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:14px;border:1px solid var(--ln)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0}.tab{font:700 14px Inter,sans-serif;border:1.5px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:999px;padding:10px 16px;cursor:pointer}.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sw2{display:none!important;font:800 13px Inter,sans-serif;border:0;border-radius:999px;padding:11px 16px;cursor:pointer;color:#fff;background:var(--bad)}.sw2.on{background:var(--ok)}
.ctb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ctb .btn{min-height:42px;font-size:14px}
@media (min-width:1000px){html,body{height:100%;overflow:hidden}body{padding-bottom:12px}main{max-width:none;height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:4px}#work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(400px,.8fr) minmax(0,1.2fr);grid-template-rows:minmax(0,1fr);gap:16px}#app,#ed{order:1}#cat{order:2;height:100%;display:flex;flex-direction:column}.tabs{display:none!important}#cat iframe{flex:1;height:auto!important;min-height:0!important;width:100%}#app,#ed{height:100%;overflow:auto;align-content:start}.tab{display:none}.tabs{padding:0;position:static}}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--ln)}.hd h1{margin:0;font-size:24px}.hd .btn{flex:none}
[hidden]{display:none!important}
.tb{display:flex;justify-content:space-between;align-items:center;gap:10px}

function unb64(t){var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function rnd(n){var u=new Uint8Array(n);crypto.getRandomValues(u);return u}
function bioId(){try{return localStorage.getItem('lf_bio')||''}catch(_){return ''}}
var IN_APP=false;try{IN_APP=!!window.parent&&window.parent!==window}catch(_){}
var _pend={};
window.addEventListener('message',function(e){if(e.source!==window.parent||!e.data||!e.data.lfBioR)return;var p=_pend[e.data.id];if(p){delete _pend[e.data.id];clearTimeout(p.t);p.f(e.data.lfBioR)}});
/* dentro do app a biometria (e o PIN) é a do próprio app, ligada em Ajustes › Segurança; no navegador, WebAuthn */
function appCall(cmd,ms){return new Promise(function(res){var id=String(Math.random());_pend[id]={f:res,t:setTimeout(function(){delete _pend[id];res('no')},ms)};try{window.parent.postMessage({lfBio:cmd,id:id},'*')}catch(_){var q=_pend[id];delete _pend[id];if(q)clearTimeout(q.t);res('no')}})}
var APP_BIO=false;
var BIO_SUP=!IN_APP&&!!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create);
function bioOK(){return IN_APP?APP_BIO:BIO_SUP}
function bioNeed(){return IN_APP?APP_BIO:!!bioId()}
function bioEnable(){
  return navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'La Fouch'},user:{id:rnd(16),name:myMail()||$('em').value.trim()||'loja',displayName:'La Fouch'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}}).then(function(c){try{localStorage.setItem('lf_bio',b64(c.rawId))}catch(_){}})}
/* lembrar e-mail e senha: o gerenciador de senhas do celular guarda; só vale com a biometria ligada */
function remUi(){var r=$('rem');if(!r)return;var off=IN_APP&&!APP_BIO;r.disabled=off;if(off)r.checked=false;if($('remh'))$('remh').hidden=!off}
function remember(em,pw){var on=!!($('rem')&&$('rem').checked&&!$('rem').disabled);
  try{if(on){localStorage.setItem('lf_rem','1');localStorage.setItem('lf_em',em)}else{localStorage.removeItem('lf_rem');localStorage.removeItem('lf_em');if(!IN_APP)localStorage.removeItem('lf_bio')}}catch(_){}
  if(!on)return;
  try{if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.store)navigator.credentials.store(new PasswordCredential({id:em,password:pw,name:'La Fouch'})).catch(function(){})}catch(_){}}
/* depois da senha, a biometria (ou o PIN do app) é obrigatória quando está ligada: sem ela o painel não abre */
function gate(em,pw){var on=!!($('rem')&&$('rem').checked&&!$('rem').disabled);
  var done=function(){remember(em,pw);start()};
  var need=IN_APP?APP_BIO:on;
  if(!need){done();return}
  if(!IN_APP&&!bioId()&&!bioOK()){say('Este aparelho não tem biometria disponível. Entrei só com a senha.',1);done();return}
  say('Confirme para entrar.');
  (IN_APP||bioId()?bioAsk():bioEnable()).then(done).catch(function(){S.tok='';try{localStorage.removeItem('lf_rt')}catch(_){}say('Não foi confirmado. O painel não foi aberto.',1)})}
try{if(localStorage.getItem('lf_rem')==='1'){$('rem').checked=true;$('em').value=localStorage.getItem('lf_em')||''}}catch(_){}
function myMail(){try{return JSON.parse(atob(S.tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''}catch(_){return ''}}
function bioAsk(){if(IN_APP)return appCall('ask',120000).then(function(r){if(r!=='ok')throw new Error('bio')});return navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(bioId())}],userVerification:'required',timeout:60000}})}
function bioUnlock(){bioAsk().then(function(){return refresh()}).then(function(ok){if(ok){$('lock').hidden=true;start()}else{$('lock').hidden=true;$('login').hidden=false;say('Sessão expirada. Entre com a senha.',1)}}).catch(function(){say('Não foi confirmado. Tente de novo ou entre com a senha.',1)})}
$('bgo').onclick=bioUnlock;
$('bpw').onclick=function(){$('lock').hidden=true;$('login').hidden=false};
$('pwb').onclick=function(){var f=$('pwf');var open=f.style.display==='none';f.style.display=open?'grid':'none';if(open)$('pw0').focus()};
$('pwf').onsubmit=function(e){e.preventDefault();var o=$('pw0').value,n=$('pw1').value,r=$('pw2').value,em=myMail();
  if(!em){say('Entre de novo para trocar a senha.',1);return}
  if(n.length<6){say('A nova senha precisa de pelo menos 6 caracteres.',1);return}
  if(n!==r){say('As duas senhas novas não são iguais.',1);return}
  if(n===o){say('A nova senha é igual à atual.',1);return}
  $('pws').disabled=true;
  fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:o,returnSecureToken:true})}).then(function(x){return x.json()}).then(function(j){
    if(!j.idToken)throw new Error('old');
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:update?key='+FB.k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:j.idToken,password:n,returnSecureToken:true})}).then(function(x){return x.json()})}).then(function(j){
    if(!j.idToken)throw new Error('upd');S.tok=j.idToken;if(j.refreshToken)saveRt(j.refreshToken);$('pwf').reset();$('pwf').style.display='none';say('Senha alterada.')}).catch(function(er){say(er.message==='old'?'Senha atual incorreta.':'Não consegui trocar a senha. Tente de novo.',1)}).then(function(){$('pws').disabled=false})};
function boot(){if(bioNeed()&&(function(){try{return !!localStorage.getItem('lf_rt')}catch(_){return false}})()){$('login').hidden=true;$('lock').hidden=false;bioUnlock()}
else refresh().then(function(ok){if(ok)start()})}
if(IN_APP)appCall('check',2000).then(function(r){APP_BIO=r==='yes';remUi();boot()});else boot();
})();
</script></body></html>
