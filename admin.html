.card{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:18px}

.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}.tg{position:relative;width:78px;height:42px;border-radius:999px;background:var(--bad);border:0;cursor:pointer;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--ok)}.tg.on::after{left:40px}

</div>

<section class="card" id="ed" hidden><h2 id="edt">Produto</h2><div style="display:grid;gap:12px">

 <div class="row"><label>Material<input id="f_mat"></label><label>Cor principal<input id="f_cor" type="color" style="padding:4px"></label></div>
 <div class="row" style="grid-template-columns:repeat(3,1fr)"><label>Lente (mm)<input id="m0" inputmode="numeric"></label><label>Ponte (mm)<input id="m1" inputmode="numeric"></label><label>Haste (mm)<input id="m2" inputmode="numeric"></label></div>
 <div><div style="font-size:13px;color:var(--mu);font-weight:600;margin-bottom:6px">Combina com rosto</div><div class="chk" id="f_rosto"></div></div>
 <div class="row"><label>Mais pedidos (0 = fora, 1 a 3)<select id="f_rank"><option value="0">Fora</option><option value="1">Nº 1</option><option value="2">Nº 2</option><option value="3">Nº 3</option></select></label><label>Aparece no site?<select id="f_ocu"><option value="0">Sim</option><option value="1">Não (escondido)</option></select></label></div>
 <div class="row"><button class="btn" id="sv">Salvar</button><button class="btn o" id="cc">Cancelar</button></div>
 <button class="btn d" id="del" hidden>Excluir produto</button></div></section></div>
</main>

/* conversão Firestore */
function tf(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='string')return{stringValue:v};if(typeof v==='boolean')return{booleanValue:v};if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(tf)}};var f={};Object.keys(v).forEach(function(k){f[k]=tf(v[k])});return{mapValue:{fields:f}}}

function start(){$('login').hidden=true;$('out').hidden=false;view('cat');$('pvf').src='index.html?p='+Date.now();load().then(function(){var q=new URLSearchParams(location.search).get('edit');if(q)edit(q)}).catch(function(){say('Não consegui carregar os dados.',1)})}
addEventListener('resize',function(){if(S.tok&&$('ed').hidden)view(S.view||'cat')});
document.getElementById('tabs').onclick=function(e){var t=e.target.closest('.tab');if(t)view(t.getAttribute('data-v'))};
window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||!e.data.lfEdit)return;edit(e.data.lfEdit)});
/* config */
function saveCfg(extra){var c=Object.assign({},S.cfg,extra||{});
  return put('config/site',{ativo:c.ativo!==false,aviso:c.aviso||'',video:c.video||'',destaque:c.destaque||''}).then(function(){S.cfg=c;draw()})}
$('tg2').onclick=function(){$('tgl').click()};
$('tgl').onclick=function(){var nv=!(S.cfg.ativo!==false);if(!nv&&!confirm('Desligar o site? Os visitantes verão o aviso.'))return;saveCfg({ativo:nv,aviso:$('avs').value.trim()}).then(function(){say(nv?'Site no ar.':'Site desligado.');reloadCat()}).catch(function(e){say(e.message==='perm'?'Sem permissão. Entre de novo.':'Erro ao salvar.',1)})};
$('svc').onclick=function(){saveCfg({aviso:$('avs').value.trim(),video:$('vid').value.trim(),destaque:$('dst').value}).then(function(){say('Salvo.');reloadCat()}).catch(function(){say('Erro ao salvar.',1)})};
/* editor */
$('f_rosto').innerHTML=ROSTOS.map(function(r){return '<label><input type="checkbox" value="'+r[0]+'">'+r[1]+'</label>'}).join('');
function hint(){var n=+$('f_n').value||0;$('hint').textContent=n?'≈ R$ '+(Math.round(n/1400/5)*5)+' (referência: 1 real = 1.400 Gs.)':''}
$('f_n').oninput=hint;
function edit(ref){
  var p=S.prods.filter(function(x){return x.ref===ref})[0]||null;S.cur=p;S.fotoNova=null;
  var d=p||{ref:'',nome:'',tipo:'solar',n:'',de:0,aviso:'',tag:'',mat:'Acetato',cor:'#2a2d33',med:[52,19,145],rosto:['oval'],rank:0,oculto:false};
  $('edt').textContent=p?'Editar '+p.ref:'Novo produto';$('f_ref').value=d.ref;$('f_ref').disabled=!!p;$('f_tipo').value=d.tipo||'solar';$('f_nome').value=d.nome;$('f_n').value=d.n;$('f_de').value=d.de||'';
  $('f_av').value=d.aviso||'';$('f_tag').value=d.tag||'';$('f_mat').value=d.mat||'';$('f_cor').value=d.cor||'#2a2d33';
  [0,1,2].forEach(function(i){$('m'+i).value=(d.med||[])[i]||''});$('f_rank').value=String(d.rank||0);$('f_ocu').value=d.oculto?'1':'0';
  Array.prototype.forEach.call($('f_rosto').querySelectorAll('input'),function(c){c.checked=(d.rosto||[]).indexOf(c.value)>=0});
  var im=document.querySelector('[data-ph="'+(p&&p.ref)+'"]');$('fp').hidden=!(im&&im.src&&!im.hidden);if(!$('fp').hidden)$('fp').src=im.src;$('ff').value='';
  $('del').hidden=!p;hint();$('ed').hidden=false;$('app').hidden=true;if(!W()){$('cat').hidden=true;$('tabs').hidden=true}scrollTo(0,0)}
$('pl').onclick=function(e){var t=e.target.closest('[data-r]');if(t)edit(t.getAttribute('data-r'))};
$('new').onclick=function(){edit('')};
$('cc').onclick=function(){view(S.view||'cat')};
$('ff').onchange=function(){var f=this.files&&this.files[0];if(!f)return;
  createImageBitmap(f,{imageOrientation:'from-image'}).then(function(bm){var s=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
    var q=.85,u=c.toDataURL('image/jpeg',q);while(u.length>700000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}S.fotoNova=u;$('fp').src=u;$('fp').hidden=false}).catch(function(){say('Não consegui abrir essa foto.',1)})};
$('sv').onclick=function(){
  var ref=$('f_ref').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!ref){say('Informe o código do produto.',1);return}
  if(!S.cur&&S.prods.some(function(p){return p.ref===ref})){say('Esse código já existe.',1);return}
  var nome=$('f_nome').value.trim(),n=parseInt($('f_n').value,10);if(!nome||!n){say('Preencha nome e preço.',1);return}
  var rosto=Array.prototype.filter.call($('f_rosto').querySelectorAll('input'),function(c){return c.checked}).map(function(c){return c.value});if(!rosto.length)rosto=['oval'];
  var old=S.cur||{},o={ref:ref,nome:nome,tipo:$('f_tipo').value,n:n,de:parseInt($('f_de').value,10)||0,aviso:$('f_av').value,tag:$('f_tag').value.trim()||$('f_tipo').value.toUpperCase(),mat:$('f_mat').value.trim()||'Acetato',cor:$('f_cor').value,cores:[$('f_cor').value],raio:old.raio||14,
    med:[+$('m0').value||52,+$('m1').value||19,+$('m2').value||145],rosto:rosto,rank:+$('f_rank').value,oculto:$('f_ocu').value==='1',fv:old.fv||0,ord:old.ord||(S.prods.reduce(function(m,p){return Math.max(m,p.ord||0)},0)+1),uv:$('f_tipo').value==='solar'};
  if(S.fotoNova)o.fv=Math.floor(Date.now()/1000);
  $('sv').disabled=true;
  var p=S.fotoNova?put('fotos/'+ref,{d:S.fotoNova}):Promise.resolve();
  p.then(function(){return put('produtos/'+ref,o)}).then(function(){return load()}).then(function(){view(S.view||'cat');reloadCat();say('Produto salvo.')}).catch(function(e){say(e.message==='perm'?'Sem permissão. Entre de novo.':'Erro ao salvar.',1)}).then(function(){$('sv').disabled=false})};
$('del').onclick=function(){if(!S.cur||!confirm('Excluir '+S.cur.nome+'?'))return;var ref=S.cur.ref;
  api('DELETE','produtos/'+ref).then(function(){return api('DELETE','fotos/'+ref)}).then(load).then(function(){view(S.view||'cat');reloadCat();say('Produto excluído.')}).catch(function(){say('Erro ao excluir.',1)})};
$('seedb').onclick=function(){if(!confirm('Enviar os '+SEED.length+' produtos do site atual?'))return;$('seedb').disabled=true;
  SEED.reduce(function(a,p){return a.then(function(){return put('produtos/'+p.ref,p)})},put('config/site',{ativo:true,aviso:'',video:'',destaque:'SL2210'})).then(load).then(function(){say('Catálogo enviado.')}).catch(function(){say('Erro ao enviar.',1)}).then(function(){$('seedb').disabled=false})};
$('pvc').onclick=function(){if(!W())view('cat');$('pvf').src='index.html?cliente=1&p='+Date.now();$('pvc').hidden=true;$('pvr').hidden=false};
$('pvr').onclick=function(){if(!W())view('cat');$('pvf').src='index.html?p='+Date.now();$('pvc').hidden=false;$('pvr').hidden=true};
$('go').onclick=signIn;$('pw').onkeydown=function(e){if(e.key==='Enter')signIn()};
$('out').onclick=function(){try{localStorage.removeItem('lf_rt')}catch(_){}location.reload()};
refresh().then(function(ok){if(ok)start()});
})();
</script></body></html>
