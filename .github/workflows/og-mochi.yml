name: Prévia do teste do Mochi (temática do dia)
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: og-mochi
  cancel-in-progress: false
jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/og_mochi.py
      - name: Publicar se mudou
        run: |
          git config user.name "La Fouch bot"
          git config user.email "bot@lafouch.com"
          git add descubra-o-grau.html descubri-tu-graduacion.html
          git diff --cached --quiet || (git commit -m "Prévia do teste do Mochi: temática do dia" && git pull --rebase && git push)
