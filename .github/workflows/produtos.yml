name: Páginas dos produtos
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produtos
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/gen_produtos.py
      - name: Publicar se mudou
        run: |
          git config user.name "La Fouch bot"
          git config user.email "bot@lafouch.com"
          git add -A p
          git diff --cached --quiet || (git commit -m "Atualiza páginas dos produtos" && git push)
