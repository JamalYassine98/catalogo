<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Medição</title>
<style>body{margin:0;padding:16px;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#111}h1{font-size:18px;margin:0 0 8px}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f5;border-radius:12px;padding:12px;font-size:13px}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #999;background:#fff;margin:4px 4px 4px 0}.e{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px)}</style></head><body>
<h1>Medição do aparelho</h1>
<p>Abra no mesmo navegador do site. Tire um print desta tela em cada tamanho de texto (A pequeno, médio, grande) e também depois de rolar a página do site.</p>
<div>Tamanho de texto do site: <button onclick="s(0)">A</button><button onclick="s(1)">A+</button><button onclick="s(2)">A++</button></div>
<pre id="o">medindo…</pre>
<div style="height:120vh"></div><p>Fim da página (role até aqui e veja se os números mudam).</p>
<div id="sa" style="position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)"></div>
<script>
function LFK(){var w=innerWidth,h=innerHeight,pc=matchMedia("(min-width:1100px)").matches,k=1;if(pc)k=1;else if(Math.min(w,h)>=600)k=Math.max(1,Math.min(1.2,Math.min(w,h)/560));return +k.toFixed(3)}
function LFZ(i){var pc=matchMedia("(min-width:1100px)").matches,b=(pc?[.8,.9,1]:[1,1.12,1.25])[i]||1;return +(b*LFK()).toFixed(3)}
function s(i){try{localStorage.setItem("lf_zoom",i)}catch(e){}m()}
function m(){var zi=0;try{zi=+localStorage.getItem("lf_zoom")||0}catch(e){}
var vv=window.visualViewport,cs=getComputedStyle(document.getElementById("sa")),d=document.documentElement;
var L=["data/hora: "+new Date().toLocaleString("pt-BR"),
"navegador: "+navigator.userAgent,
"innerWidth x innerHeight: "+innerWidth+" x "+innerHeight,
"documentElement client: "+d.clientWidth+" x "+d.clientHeight,
"visualViewport: "+(vv?Math.round(vv.width*100)/100+" x "+Math.round(vv.height*100)/100+" escala "+vv.scale:"n/d"),
"screen: "+screen.width+" x "+screen.height+" (avail "+screen.availWidth+" x "+screen.availHeight+")",
"devicePixelRatio: "+devicePixelRatio,
"pixels físicos aprox.: "+Math.round(screen.width*devicePixelRatio)+" x "+Math.round(screen.height*devicePixelRatio),
"orientação: "+(screen.orientation?screen.orientation.type:"n/d"),
"100svh / 100lvh / 100dvh (px): "+[ "svh","lvh","dvh"].map(function(u){var e=document.createElement("div");e.style.cssText="position:fixed;visibility:hidden;height:100"+u;document.body.appendChild(e);var r=e.getBoundingClientRect().height;e.remove();return r}).join(" / "),
"área segura (topo/dir/base/esq): "+cs.paddingTop+" "+cs.paddingRight+" "+cs.paddingBottom+" "+cs.paddingLeft,
"rolagem atual (scrollY): "+Math.round(scrollY),
"modo tela cheia/standalone: "+(matchMedia("(display-mode: standalone)").matches),
"fonte do sistema (1rem em px): "+getComputedStyle(d).fontSize,
"texto do site (lf_zoom): "+zi,
"LFK (escala base): "+LFK(),
"LFZ do tamanho atual: "+LFZ(zi),
"LFZ A / A+ / A++: "+[0,1,2].map(LFZ).join(" / "),
"largura/altura do site após zoom (css): "+Math.round(innerWidth/LFZ(zi))+" x "+Math.round(innerHeight/LFZ(zi))];
document.getElementById("o").textContent=L.join("\n")}
m();addEventListener("resize",m);addEventListener("scroll",m,{passive:true});
</script></body></html>
