<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>La Fouch</title>
<script>(function(){var p=location.pathname,s=location.search.replace(/^\?/,''),m;
if(/^\/carrinho\/?$/.test(p)){location.replace('/?carrinho=1');return}
if(/^\/conta\/?$/.test(p)){location.replace('/?conta=1');return}
m=p.match(/^\/t\/([A-Za-z0-9-]{4,24})\/?$/);if(m){location.replace('/?t='+m[1]);return}
/* S185: seleção de peças lafouch.com/s/REF.REF~Nome */m=p.match(/^\/s\/([A-Za-z0-9_.~%-]{2,300})\/?$/);if(m){var q=decodeURIComponent(m[1]).split('~');location.replace('/?s='+encodeURIComponent(q[0])+(q[1]?'&n='+encodeURIComponent(q[1]):''));return}
m=p.match(/^\/(?:p|modelo)\/([A-Za-z0-9_-]+)(?:\.html)?\/?$/);if(m){location.replace('/?ref='+m[1]);return}
m=p.match(/^\/([a-z0-9-]{2,40})(?:\.html)?\/?$/i);if(m){location.replace('/?r='+m[1].toLowerCase()+(s?'&'+s:''));return}
location.replace('/')})()</script></head><body><p><a href="/">Ir para a La Fouch</a></p></body></html>
